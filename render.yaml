services:
  - type: web
    name: fondeino-web
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn fondeino_web.wsgi:application"
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 2
      - key: ALLOWED_HOSTS
        value: "fondeino.com,www.fondeino.com"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
