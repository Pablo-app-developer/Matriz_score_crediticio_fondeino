{% extends 'base.html' %}
{% block title %}¿Olvidaste tu contraseña? — FONDEINO{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4 col-sm-8">
    <div class="card shadow">
      <div class="card-body p-4 text-center">
        {% load static %}
        <img src="{% static 'img/logo-color.png' %}" alt="Fondeino" style="height:72px;object-fit:contain;margin-bottom:16px;"><br>
        <i class="bi bi-lock text-secondary" style="font-size:2rem;"></i>
        <h5 class="mt-3">¿Olvidaste tu contraseña?</h5>
        <p class="text-muted small mt-2">
          Escríbele al administrador por WhatsApp y te la restablece de inmediato.
        </p>
        <a href="https://wa.me/573214498647?text=Hola%2C+olvid%C3%A9+mi+contrase%C3%B1a+en+FONDEINO"
           target="_blank" rel="noopener"
           class="btn btn-success w-100 mt-2">
          <i class="bi bi-whatsapp me-1"></i>Escribir por WhatsApp
        </a>
        <div class="mt-3">
          <a href="{% url 'accounts:login' %}" class="text-muted small">Volver al inicio de sesión</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
